syntax = "proto3";

package openprot.mauv;

import "shared/tlv/options.proto";
import "shared/openprot/proto/crypto.proto";
import "shared/openprot/proto/identity.proto";

// A signed minimum acceptable update version (MAUV) record descriptor container
// (communication, host tools, etc.).
message SignedDescriptor {
  option (openprot.tlv.tlv_fourcc) = "MVSD";

  Descriptor descriptor = 1;
  repeated openprot.crypto.SignatureContainer signature = 2;
}

// The minimum acceptable update version (MAUV) record descriptor.
message Descriptor {
  option (openprot.tlv.tlv_fourcc) = "MAUV";

  // Minimum acceptable BL0 security version (`min_security_version_bl0`).
  uint32 min_security_version_bl0 = 1 [(openprot.tlv.offset) = 0];
  openprot.identity.ImageVendor image_vendor = 2 [(openprot.tlv.offset) = 4];
  openprot.identity.ImageFamily image_family = 3 [(openprot.tlv.offset) = 12];
}
