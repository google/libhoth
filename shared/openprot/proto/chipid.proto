syntax = "proto3";

package openprot.chipid;

import "shared/tlv/options.proto";

enum ChipFamily {
  option (openprot.tlv.raw_type) = "u32";
  CHIP_FAMILY_UNKNOWN = 0;
  CHIP_FAMILY_HOTH = 1;
  CHIP_FAMILY_OPENTITAN = 2;
}

message ChipId {
  option (openprot.tlv.tlv_fourcc) = "C_ID";

  ChipFamily chip_family = 1 [(openprot.tlv.offset) = 0];
  bytes chip_id = 2
      [(openprot.tlv.extra_data) = true, (openprot.tlv.type) = "[u8]"];
}
