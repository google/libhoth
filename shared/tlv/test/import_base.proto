syntax = "proto3";

package openprot.tlv.test.imports.base;

import "shared/tlv/options.proto";

enum BaseStatus {
  option (openprot.tlv.raw_type) = "u8";

  BASE_STATUS_UNKNOWN = 0;
  BASE_STATUS_OK = 1;
  BASE_STATUS_ERROR = 2;
}

message BaseRecord {
  option (openprot.tlv.tlv_fourcc) = "BREC";

  uint32 id = 1 [(openprot.tlv.offset) = 0];
  BaseStatus status = 2 [(openprot.tlv.offset) = 4];
}
