syntax = "proto3";

package openprot.tlv.test.imports.layered;

import "shared/tlv/options.proto";
import "shared/tlv/test/import_base.proto";
import "shared/tlv/test/import_simple.proto";

message LayeredMessage {
  option (openprot.tlv.tlv_fourcc) = "LAYR";

  uint32 layer_id = 1 [(openprot.tlv.offset) = 0];

  // Extension items from both simple and base crates
  openprot.tlv.test.imports.simple.SimpleMessage simple = 2;
  openprot.tlv.test.imports.base.BaseRecord base = 3;
}
