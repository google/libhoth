syntax = "proto3";

package openprot.crypto;

import "contrib/tlv/options.proto";

// The authority or purpose domain of a cryptographic key.
enum KeyDomain {
  option (openprot.tlv.raw_type) = "u32";
  KEY_DOMAIN_UNSPECIFIED = 0;
  KEY_DOMAIN_PAYLOAD_PROD = 0x444f5250;  // "PROD"
  KEY_DOMAIN_PAYLOAD_DEV = 0x5f564544;   // "DEV_"
  KEY_DOMAIN_PAYLOAD_TEST = 0x54534554;  // "TEST"
  KEY_DOMAIN_BIOS_PROD = 0x504f4942;     // "BIOP"
  KEY_DOMAIN_BIOS_DEV = 0x444f4942;      // "BIOD"
  KEY_DOMAIN_ROTR = 0x52544f52;          // "ROTR"
}

// -----------------------------------------------------------------------------
// Cryptographic Hash Digests
// -----------------------------------------------------------------------------

message Sha2_256Digest {
  option (openprot.tlv.tlv_fourcc) = "SH22";
  bytes data = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 32]"
  ];
}

message Sha2_384Digest {
  option (openprot.tlv.tlv_fourcc) = "SH23";
  bytes data = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 48]"
  ];
}

message Sha2_512Digest {
  option (openprot.tlv.tlv_fourcc) = "SH25";
  bytes data = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 64]"
  ];
}

message Sha3_256Digest {
  option (openprot.tlv.tlv_fourcc) = "SH32";
  bytes data = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 32]"
  ];
}

message Sha3_384Digest {
  option (openprot.tlv.tlv_fourcc) = "SH33";
  bytes data = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 48]"
  ];
}

message Sha3_512Digest {
  option (openprot.tlv.tlv_fourcc) = "SH35";
  bytes data = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 64]"
  ];
}

// -----------------------------------------------------------------------------
// Public Key Material & Public Keys
// -----------------------------------------------------------------------------

message P256PublicMaterial {
  option (openprot.tlv.tlv_fourcc) = "P256";
  // P256 `x` coordinate in little-endian byte order.
  bytes x = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u32; 8]"
  ];
  // P256 `y` coordinate in little-endian byte order.
  bytes y = 2 [
    (openprot.tlv.offset) = 32,
    (openprot.tlv.type) = "[u32; 8]"
  ];
}

message SlhDsaPublicMaterial {
  option (openprot.tlv.tlv_fourcc) = "SPX+";
  // SLH-DSA SHA2-128s key material.
  bytes slhdsa = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u32; 8]"
  ];
}

message MlDsa44PublicMaterial {
  option (openprot.tlv.tlv_fourcc) = "ML44";
  // ML-DSA-44 key material.
  bytes mldsa = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 1312]"
  ];
}

message HybridP256SlhDsaPublicMaterial {
  option (openprot.tlv.tlv_fourcc) = "H+S2";
  // P256 `x` coordinate in little-endian byte order.
  bytes x = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u32; 8]"
  ];
  // P256 `y` coordinate in little-endian byte order.
  bytes y = 2 [
    (openprot.tlv.offset) = 32,
    (openprot.tlv.type) = "[u32; 8]"
  ];
  // SLH-DSA SHA2-128s key material.
  bytes slhdsa = 3 [
    (openprot.tlv.offset) = 64,
    (openprot.tlv.type) = "[u32; 8]"
  ];
}

message HybridP256MlDsa44PublicMaterial {
  option (openprot.tlv.tlv_fourcc) = "M4P2";
  // P256 `x` coordinate in little-endian byte order.
  bytes x = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u32; 8]"
  ];
  // P256 `y` coordinate in little-endian byte order.
  bytes y = 2 [
    (openprot.tlv.offset) = 32,
    (openprot.tlv.type) = "[u32; 8]"
  ];
  // ML-DSA-44 key material.
  bytes mldsa = 3 [
    (openprot.tlv.offset) = 64,
    (openprot.tlv.type) = "[u8; 1312]"
  ];
}

// The public exponent is not carried in this message: it is fixed at 65537
// (0x10001, F4) for all supported RSA keys, so only the modulus is needed to
// reconstruct the public key.
message Rsa2048PublicMaterial {
  option (openprot.tlv.tlv_fourcc) = "RSA2";
  // RSA-2048 public key modulus.
  bytes modulus = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 256]"
  ];
}

// The public exponent is fixed at 65537 (0x10001, F4); see
// `Rsa2048PublicMaterial`.
message Rsa3072PublicMaterial {
  option (openprot.tlv.tlv_fourcc) = "RSA3";
  // RSA-3072 public key modulus.
  bytes modulus = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 384]"
  ];
}

// The public exponent is fixed at 65537 (0x10001, F4); see
// `Rsa2048PublicMaterial`.
message Rsa4096PublicMaterial {
  option (openprot.tlv.tlv_fourcc) = "RSA4";
  // RSA-4096 public key modulus.
  bytes modulus = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 512]"
  ];
}

message PublicKey {
  option (openprot.tlv.tlv_fourcc) = "PKEY";

  // Key domain: PROD, DEV, TEST, etc.
  KeyDomain key_domain = 1 [(openprot.tlv.offset) = 0];

  // Key material.
  oneof key_material {
    P256PublicMaterial p256 = 2;
    SlhDsaPublicMaterial slhdsa = 3;
    MlDsa44PublicMaterial mldsa = 4;
    HybridP256SlhDsaPublicMaterial hybrid_p256_slhdsa = 5;
    HybridP256MlDsa44PublicMaterial hybrid_p256_mldsa = 6;
    Rsa2048PublicMaterial rsa2048 = 7;
    Rsa3072PublicMaterial rsa3072 = 8;
    Rsa4096PublicMaterial rsa4096 = 9;
  }
}

// -----------------------------------------------------------------------------
// Signatures & Signature Containers
// -----------------------------------------------------------------------------

message P256Signature {
  option (openprot.tlv.tlv_fourcc) = "P256";
  // P256 `r` in little-endian byte order.
  bytes r = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u32; 8]"
  ];
  // P256 `s` in little-endian byte order.
  bytes s = 2 [
    (openprot.tlv.offset) = 32,
    (openprot.tlv.type) = "[u32; 8]"
  ];
}

message SlhDsaSignature {
  option (openprot.tlv.tlv_fourcc) = "SPX+";
  // SLH-DSA signature.
  bytes slhdsa = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u32; 1964]"
  ];
}

message MlDsa44Signature {
  option (openprot.tlv.tlv_fourcc) = "ML44";
  // ML-DSA-44 key signature.
  bytes mldsa = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u8; 2420]"
  ];
}

message HybridP256SlhDsaSignature {
  option (openprot.tlv.tlv_fourcc) = "H+S2";
  // P256 `r` in little-endian byte order.
  bytes r = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u32; 8]"
  ];
  // P256 `s` in little-endian byte order.
  bytes s = 2 [
    (openprot.tlv.offset) = 32,
    (openprot.tlv.type) = "[u32; 8]"
  ];
  // SLH-DSA signature.
  bytes slhdsa = 3 [
    (openprot.tlv.offset) = 64,
    (openprot.tlv.type) = "[u32; 1964]"
  ];
}

message HybridP256MlDsa44Signature {
  option (openprot.tlv.tlv_fourcc) = "M4P2";
  // P256 `r` in little-endian byte order.
  bytes r = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u32; 8]"
  ];
  // P256 `s` in little-endian byte order.
  bytes s = 2 [
    (openprot.tlv.offset) = 32,
    (openprot.tlv.type) = "[u32; 8]"
  ];
  // ML-DSA-44 signature.
  bytes mldsa = 3 [
    (openprot.tlv.offset) = 64,
    (openprot.tlv.type) = "[u8; 2420]"
  ];
}

message SignatureContainer {
  option (openprot.tlv.tlv_fourcc) = "SIGC";

  // The public key that will verify the signature in this container.
  PublicKey public_key = 1;
  // The signature over the descriptor TLV.
  Signature signature = 2;
}

message Signature {
  option (openprot.tlv.tlv_fourcc) = "SIGN";

  oneof signature {
    P256Signature p256 = 1;
    SlhDsaSignature slhdsa = 2;
    MlDsa44Signature mldsa = 3;
    HybridP256SlhDsaSignature hybrid_p256_slhdsa = 4;
    HybridP256MlDsa44Signature hybrid_p256_mldsa = 5;
  }
}

// -----------------------------------------------------------------------------
// Public Key Fingerprints
// -----------------------------------------------------------------------------

message P256Fingerprint {
  option (openprot.tlv.tlv_fourcc) = "P256";
  oneof digest {
    Sha2_256Digest sha2_256 = 1;
    Sha2_384Digest sha2_384 = 2;
  }
}

message SlhDsaFingerprint {
  option (openprot.tlv.tlv_fourcc) = "SPX+";
  oneof digest {
    Sha2_256Digest sha2_256 = 1;
    Sha2_384Digest sha2_384 = 2;
  }
}

message Rsa2048Fingerprint {
  option (openprot.tlv.tlv_fourcc) = "RSA2";
  oneof digest {
    Sha2_256Digest sha2_256 = 1;
    Sha2_384Digest sha2_384 = 2;
  }
}

message Rsa3072Fingerprint {
  option (openprot.tlv.tlv_fourcc) = "RSA3";
  oneof digest {
    Sha2_256Digest sha2_256 = 1;
    Sha2_384Digest sha2_384 = 2;
  }
}

message Rsa4096Fingerprint {
  option (openprot.tlv.tlv_fourcc) = "RSA4";
  oneof digest {
    Sha2_256Digest sha2_256 = 1;
    Sha2_384Digest sha2_384 = 2;
  }
}

message HybridP256SlhDsaFingerprint {
  option (openprot.tlv.tlv_fourcc) = "H+S2";
  oneof digest {
    Sha2_256Digest sha2_256 = 1;
    Sha2_384Digest sha2_384 = 2;
  }
}

message MlDsa44Fingerprint {
  option (openprot.tlv.tlv_fourcc) = "ML44";
  oneof digest {
    Sha2_256Digest sha2_256 = 1;
    Sha2_384Digest sha2_384 = 2;
  }
}

message HybridP256MlDsa44Fingerprint {
  option (openprot.tlv.tlv_fourcc) = "M4P2";
  oneof digest {
    Sha2_256Digest sha2_256 = 1;
    Sha2_384Digest sha2_384 = 2;
  }
}

// Public key fingerprint.
message KeyFingerprint {
  option (openprot.tlv.tlv_fourcc) = "KFIP";

  KeyDomain key_domain = 1 [(openprot.tlv.offset) = 0];

  // Digest.
  oneof key_type {
    P256Fingerprint p256 = 2;
    SlhDsaFingerprint slhdsa = 3;
    Rsa2048Fingerprint rsa2048 = 4;
    Rsa3072Fingerprint rsa3072 = 5;
    Rsa4096Fingerprint rsa4096 = 6;
    HybridP256SlhDsaFingerprint hybrid_p256_slhdsa = 7;
    MlDsa44Fingerprint mldsa = 8;
    HybridP256MlDsa44Fingerprint hybrid_p256_mldsa = 9;
  }
}

// -----------------------------------------------------------------------------
// Symmetric Authentication & Hardware Sealing
// -----------------------------------------------------------------------------

// KMAC256 sealing ladder symmetric MAC.
message Kmac256Seal {
  option (openprot.tlv.tlv_fourcc) = "KMSL";
  bytes data = 1 [
    (openprot.tlv.offset) = 0,
    (openprot.tlv.type) = "[u32; 8]"
  ];
}

// Symmetric MAC seal generated by the firmware and stored in internal flash.
message KRSeal {
  option (openprot.tlv.tlv_fourcc) = "SEAL";

  oneof seal {
    Kmac256Seal kmsl = 1;
  }
}
