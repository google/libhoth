syntax = "proto3";

package mutask.key_rotation;

import "contrib/tlv/options.proto";
import "contrib/openprot/proto/crypto.proto";
import "contrib/openprot/proto/identity.proto";

// A signed key rotation record descriptor container (communication, host tools, etc.).
message SignedDescriptor {
  option (openprot.tlv.tlv_fourcc) = "KRSD";

  Descriptor descriptor = 1;
  repeated mutask.crypto.SignatureContainer signature = 2;
}

// A sealed key rotation record descriptor container (embedded storage).
message SealedDescriptor {
  option (openprot.tlv.tlv_fourcc) = "KRSL";

  Descriptor descriptor = 1;
  mutask.crypto.KRSeal seal = 2;
}

message LegacyImageFamily {
  option (openprot.tlv.tlv_fourcc) = "LGIF";
  uint32 family = 1 [(openprot.tlv.offset) = 0];
}

// The key rotation record descriptor.
message Descriptor {
  option (openprot.tlv.tlv_fourcc) = "KROT";

  uint32 version = 1 [(openprot.tlv.offset) = 0];
  mutask.identity.ImageVendor image_vendor = 2 [(openprot.tlv.offset) = 4];
  mutask.identity.ImageFamily image_family = 3 [(openprot.tlv.offset) = 12];

  optional LegacyImageFamily legacy_image_family = 4;

  // TLV extensions.
  repeated mutask.crypto.KeyFingerprint fingerprint = 5;
  repeated ImgDescriptorDigest img_descriptor_digest = 6;
}

// A digest of an allowed image descriptor.
// A list of multiple digests is represented by repeating this tag.
message ImgDescriptorDigest {
  option (openprot.tlv.tlv_fourcc) = "IDDG";

  // Digest.
  oneof digest {
    mutask.crypto.Sha2_256Digest sha2_256 = 1;
    mutask.crypto.Sha2_384Digest sha2_384 = 2;
  }
}
